services:
  postgres:
    image: postgres:16-alpine
    container_name: growfast-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growfast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growfast_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-growfast_laundry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growfast}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
